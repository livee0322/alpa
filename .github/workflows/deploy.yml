# 워크플로우 이름
name: Deploy to Production Server

# 워크플로우 실행 조건
on:
  push:
    branches:
      - flutter
    paths:
      - 'front-end/flutter/livee/**'

# 실행될 작업들
jobs:
  build_and_deploy:
    # 실행 환경 지정
    runs-on: ubuntu-latest
    
    # 작업 단계들
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Flutter 환경 설정
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'

      # 3. Flutter 의존성 설치
      - name: Install dependencies
        run: flutter pub get
        # flutter 프로젝트가 있는 실제 폴더 경로를 지정
        working-directory: ./front-end/flutter/livee

      # 4. Flutter 웹 앱 빌드
      - name: Build Flutter web app
        run: flutter build web
        # flutter 프로젝트가 있는 실제 폴더 경로를 지정
        working-directory: ./front-end/flutter/livee

      # 5. 임시 폴더 생성 (서버 스크립트 실행)
      - name: Create temporary directory on NAS-PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: C:\DeployScripts\create_livbee_temp_dir.bat

      # 6. 빌드 결과물을 서버로 복사
      - name: Copy build files to NAS-PC
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # livbee 프로젝트의 빌드 결과물 경로로 변경
          source: "front-end/flutter/livee/build/web/*"
          target: "temp/livbee-new"
          # source 경로에서 상위 5개 폴더(front-end/flutter/livee/build/web)를 제외
          strip_components: 5

      # 7. 배포 실행 (서버 스크립트 실행)
      - name: Deploy on NAS-PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 49152
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: powershell -ExecutionPolicy Bypass -File "C:\DeployScripts\deploy_livbee.ps1"